<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="cc-bg" cx="38%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2e1c12"/>
      <stop offset="100%" stop-color="#0e0a08"/>
    </radialGradient>
    <radialGradient id="cc-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D97757" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <filter id="cc-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#cc-bg)"/>

  <!-- Ambient glow layer -->
  <rect width="512" height="512" rx="112" fill="url(#cc-glow)"/>

  <!-- Subtle inner border -->
  <rect x="1.5" y="1.5" width="509" height="509" rx="111" fill="none"
        stroke="#D97757" stroke-opacity="0.12" stroke-width="3"/>

  <!-- Glow halo behind symbol -->
  <ellipse cx="256" cy="270" rx="130" ry="110" fill="#D97757" opacity="0.13" filter="url(#cc-blur)"/>

  <!-- Terminal prompt symbol: ">" chevron -->
  <path d="M 148 190 L 248 256 L 148 322"
        stroke="#D97757" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"
        fill="none" opacity="0.95"/>

  <!-- Underscore cursor -->
  <line x1="272" y1="322" x2="372" y2="322"
        stroke="#D97757" stroke-width="40" stroke-linecap="round" opacity="0.85"/>

  <!-- Small spark dots — suggest activity/intelligence -->
  <circle cx="376" cy="176" r="12" fill="#D97757" opacity="0.5"/>
  <circle cx="404" cy="156" r="7"  fill="#D97757" opacity="0.3"/>
  <circle cx="358" cy="148" r="5"  fill="#D97757" opacity="0.2"/>
</svg>
