<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="agy-bg" cx="38%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1a1225"/>
      <stop offset="100%" stop-color="#090710"/>
    </radialGradient>
    <radialGradient id="agy-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#AD89EB" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#AD89EB" stop-opacity="0"/>
    </radialGradient>
    <filter id="agy-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="agy-glow-filter">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#agy-bg)"/>

  <!-- Ambient glow layer -->
  <rect width="512" height="512" rx="112" fill="url(#agy-glow)"/>

  <!-- Subtle inner border -->
  <rect x="1.5" y="1.5" width="509" height="509" rx="111" fill="none"
        stroke="#AD89EB" stroke-opacity="0.14" stroke-width="3"/>

  <!-- Glow halo behind symbol -->
  <ellipse cx="256" cy="256" rx="140" ry="140" fill="#AD89EB" opacity="0.10" filter="url(#agy-blur)"/>

  <!-- Gemini-style 4-pointed star (✦)
       Each arm is a narrow diamond pointing outward from center.
       Top arm, right arm, bottom arm, left arm. -->
  <path d="
    M 256 100
    C 248 176, 248 176, 180 256
    C 248 336, 248 336, 256 412
    C 264 336, 264 336, 332 256
    C 264 176, 264 176, 256 100
    Z"
    fill="#AD89EB" opacity="0.95" filter="url(#agy-glow-filter)"/>

  <!-- Second axis (rotated 90° — already implied by path above, but add a
       lighter cross to give it depth) -->
  <path d="
    M 100 256
    C 176 248, 176 248, 256 180
    C 336 248, 336 248, 412 256
    C 336 264, 336 264, 256 332
    C 176 264, 176 264, 100 256
    Z"
    fill="#AD89EB" opacity="0.55"/>

  <!-- Central dot -->
  <circle cx="256" cy="256" r="14" fill="#AD89EB" opacity="0.9"/>
</svg>
